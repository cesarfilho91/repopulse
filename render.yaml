
services:
  - type: web
    name: repopulse-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: CACHE_TTL
        value: "60"
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: repopulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: repopulse-api
          property: host
